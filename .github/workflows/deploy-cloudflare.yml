name: deploy-cloudflare-suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logistics-portfolio-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'

      - name: Check deployment configuration
        id: config
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PORTFOLIO_DOMAIN: ${{ vars.PORTFOLIO_DOMAIN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$PORTFOLIO_DOMAIN" ]; then
            echo "::notice::Cloudflare deployment is not configured yet; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy all three applications
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PORTFOLIO_DOMAIN: ${{ vars.PORTFOLIO_DOMAIN }}
          FREIGHT_HOST: ${{ vars.FREIGHT_HOST }}
          LTL_HOST: ${{ vars.LTL_HOST }}
          YARD_HOST: ${{ vars.YARD_HOST }}
          YARD_LTL_SIGNING_KEY: ${{ secrets.YARD_LTL_SIGNING_KEY }}
          ALVYS_CLIENT_ID: ${{ secrets.ALVYS_CLIENT_ID }}
          ALVYS_CLIENT_SECRET: ${{ secrets.ALVYS_CLIENT_SECRET }}
        run: bash scripts/deploy-cloudflare.sh
