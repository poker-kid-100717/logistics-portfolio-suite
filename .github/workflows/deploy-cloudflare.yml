name: deploy-cloudflare-suite

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      domain:
        description: Base domain (for example, example.com). Overrides PORTFOLIO_DOMAIN for this run.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: logistics-portfolio-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve deployment configuration
        id: config
        shell: bash
        env:
          MANUAL_DOMAIN: ${{ inputs.domain }}
          DEFAULT_DOMAIN: ${{ vars.PORTFOLIO_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DOMAIN="${MANUAL_DOMAIN:-$DEFAULT_DOMAIN}"

          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to enable deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$DOMAIN" ]; then
            echo "::notice::Provide a domain when running this workflow manually, or add PORTFOLIO_DOMAIN as a repository variable for push-to-deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy logistics suite
        id: deploy
        if: steps.config.outputs.ready == 'true'
        uses: ./.github/actions/deploy-logistics-suite
        with:
          domain: ${{ steps.config.outputs.domain }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          freight-host: ${{ vars.FREIGHT_HOST }}
          ltl-host: ${{ vars.LTL_HOST }}
          yard-host: ${{ vars.YARD_HOST }}
          yard-ltl-signing-key: ${{ secrets.YARD_LTL_SIGNING_KEY }}
          alvys-client-id: ${{ secrets.ALVYS_CLIENT_ID }}
          alvys-client-secret: ${{ secrets.ALVYS_CLIENT_SECRET }}
