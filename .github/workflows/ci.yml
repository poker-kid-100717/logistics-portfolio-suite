name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    name: Publication safety scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/scan-for-sensitive.sh
      - name: Validate deployment scripts
        run: |
          bash -n scripts/deploy-cloudflare.sh

  backend:
    name: .NET 10 APIs and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: |
          dotnet restore apps/freight-ops/api/Portfolio.Freight.Api.csproj
          dotnet restore apps/freight-ops/tests/Portfolio.Freight.Api.Tests.csproj
          dotnet restore apps/ltl-planner/api/Portfolio.Ltl.Api.csproj
          dotnet restore apps/ltl-planner/tests/Portfolio.Ltl.Api.Tests.csproj
          dotnet restore apps/yard-ops/api/Portfolio.Yard.Api.csproj
          dotnet restore apps/yard-ops/tests/Portfolio.Yard.Api.Tests.csproj
      - name: Vulnerability report
        run: |
          dotnet list apps/freight-ops/api/Portfolio.Freight.Api.csproj package --vulnerable --include-transitive
          dotnet list apps/ltl-planner/api/Portfolio.Ltl.Api.csproj package --vulnerable --include-transitive
          dotnet list apps/yard-ops/api/Portfolio.Yard.Api.csproj package --vulnerable --include-transitive
      - name: Build
        run: |
          dotnet build apps/freight-ops/api/Portfolio.Freight.Api.csproj -c Release --no-restore
          dotnet build apps/ltl-planner/api/Portfolio.Ltl.Api.csproj -c Release --no-restore
          dotnet build apps/yard-ops/api/Portfolio.Yard.Api.csproj -c Release --no-restore
      - name: Test
        run: |
          dotnet test apps/freight-ops/tests/Portfolio.Freight.Api.Tests.csproj -c Release --no-restore
          dotnet test apps/ltl-planner/tests/Portfolio.Ltl.Api.Tests.csproj -c Release --no-restore
          dotnet test apps/yard-ops/tests/Portfolio.Yard.Api.Tests.csproj -c Release --no-restore

  frontend:
    name: Angular 22 - ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [freight-ops, ltl-planner, yard-ops]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
      - name: Install
        run: npm install
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  compose:
    name: Compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet


  cloudflare-action:
    name: Cloudflare composite action dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/deploy-logistics-suite
        with:
          domain: portfolio.example.com
          cloudflare-api-token: dry-run
          cloudflare-account-id: dry-run
          yard-ltl-signing-key: dry-run-yard-ltl-signing-key
          validate-only: "true"
