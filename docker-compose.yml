services:
  freight-api:
    build: ./apps/freight-ops/api
    environment:
      ASPNETCORE_URLS: http://+:8080
      Alvys__Mode: ${ALVYS_MODE:-Demo}
      Alvys__ClientId: ${ALVYS_CLIENT_ID:-}
      Alvys__ClientSecret: ${ALVYS_CLIENT_SECRET:-}
      Alvys__TokenUrl: ${ALVYS_TOKEN_URL:-https://auth.alvys.com/oauth/token}
      Alvys__Audience: ${ALVYS_AUDIENCE:-https://api.alvys.com/public/}
      Alvys__ApiBaseUrl: ${ALVYS_API_BASE_URL:-https://integrations.alvys.com/api/p/}
      Alvys__LoadApiVersion: ${ALVYS_LOAD_API_VERSION:-v1}
    ports: ["5101:8080"]

  freight-web:
    build:
      context: ./apps/freight-ops/web
      args:
        API_UPSTREAM: freight-api:8080
    depends_on: [freight-api]
    ports: ["4201:80"]

  ltl-api:
    build: ./apps/ltl-planner/api
    environment:
      ASPNETCORE_URLS: http://+:8080
      Integration__YardSigningKey: ${YARD_LTL_SIGNING_KEY:-portfolio-dev-only-change-me}
      Alvys__Mode: ${ALVYS_MODE:-Demo}
      Alvys__ClientId: ${ALVYS_CLIENT_ID:-}
      Alvys__ClientSecret: ${ALVYS_CLIENT_SECRET:-}
      Alvys__TokenUrl: ${ALVYS_TOKEN_URL:-https://auth.alvys.com/oauth/token}
      Alvys__Audience: ${ALVYS_AUDIENCE:-https://api.alvys.com/public/}
      Alvys__ApiBaseUrl: ${ALVYS_API_BASE_URL:-https://integrations.alvys.com/api/p/}
      Alvys__LoadApiVersion: ${ALVYS_LOAD_API_VERSION:-v1}
    ports: ["5102:8080"]

  ltl-web:
    build:
      context: ./apps/ltl-planner/web
      args:
        API_UPSTREAM: ltl-api:8080
    depends_on: [ltl-api]
    ports: ["4202:80"]

  yard-api:
    build: ./apps/yard-ops/api
    environment:
      ASPNETCORE_URLS: http://+:8080
      Ltl__BaseUrl: http://ltl-api:8080/
      Ltl__SigningKey: ${YARD_LTL_SIGNING_KEY:-portfolio-dev-only-change-me}
      Alvys__Mode: ${ALVYS_MODE:-Demo}
      Alvys__ClientId: ${ALVYS_CLIENT_ID:-}
      Alvys__ClientSecret: ${ALVYS_CLIENT_SECRET:-}
      Alvys__TokenUrl: ${ALVYS_TOKEN_URL:-https://auth.alvys.com/oauth/token}
      Alvys__Audience: ${ALVYS_AUDIENCE:-https://api.alvys.com/public/}
      Alvys__ApiBaseUrl: ${ALVYS_API_BASE_URL:-https://integrations.alvys.com/api/p/}
      Alvys__TrailerApiVersion: ${ALVYS_TRAILER_API_VERSION:-v1}
    depends_on: [ltl-api]
    ports: ["5103:8080"]

  yard-web:
    build:
      context: ./apps/yard-ops/web
      args:
        API_UPSTREAM: yard-api:8080
    depends_on: [yard-api]
    ports: ["4203:80"]
